
<!DOCTYPE html>
<html>
<head>
    <title>To Do List</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
        }

        .container {
            background: white;
            width: 350px;
            margin: 100px auto;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            width: 60%;
        }

        button {
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        li {
            margin: 15px;
            text-align: left;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>My To Do List</h2>

    <input type="text" id="task"
    placeholder="Enter a task">

    <button onclick="addTask()">Add</button>

    <ul id="taskList"></ul>

</div>

<script>

function addTask() {

    let input = document.getElementById("task");
    let value = input.value.trim();

    if (value === "") {
        alert("Enter a task");
        return;
    }

    let li = document.createElement("li");

    li.textContent = value;

    li.onclick = function() {
        li.classList.toggle("completed");
    };

    let btn = document.createElement("button");

    btn.textContent = "Delete";

    btn.onclick = function(event) {
        event.stopPropagation();
        li.remove();
    };

    li.appendChild(btn);

    document.getElementById("taskList")
    .appendChild(li);

    input.value = "";
}

</script>

</body>
</html>
